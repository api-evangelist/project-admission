name: Project Admission
description: >-
  Project Admission is a ticketing technology company serving the live event industry —
  professional sports teams, leagues, artists, theaters, and venues. It layers on top of
  existing ticketing systems such as SeatGeek, Ticketmaster, and AXS to expand opportunities
  around the ticket and capture more value before, during, and after an event. Its platform
  provides branded storefronts, multi-channel inventory management, bulk ticket distribution,
  split season-ticket ingestion, and fan-engagement tools including influencer and group-sales
  programs. Project Admission does not publicly expose a developer API, SDKs, or developer
  portal; this profile captures its verified public web and security surface. Surfaced as a
  portfolio company of Anthemis and Techstars and added to the API Evangelist network.
